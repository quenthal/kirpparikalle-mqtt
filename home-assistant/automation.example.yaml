alias: Kirppari-Kalle - uusi myynti
description: Ilmoittaa Kirppari-Kallen uusista myynneistä

triggers:
  - trigger: mqtt
    topic: kirpparikalle/update

conditions:
  - condition: template
    value_template: >-
      {{ trigger.payload_json.event_type == 'sales_update'
         and (trigger.payload_json.new_sales | default([]) | count) > 0 }}

actions:
  - action: notify.notify
    data:
      message: >-
        {% set p = trigger.payload_json %}
        Kirppari-Kalle: saldo {{ "%.2f"|format(p.balance | float) }} €
        (+{{ "%.2f"|format(p.balance_change | float) }} €)

        Myyty viime tarkistuksen jälkeen:
        {% for item in p.new_sales %}
        • {{ item.name }} — {{ "%.2f"|format(item.price | float) }} €
        {% endfor %}

mode: queued
max: 10
